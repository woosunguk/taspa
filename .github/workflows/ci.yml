name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 같은 브랜치(PR)의 이전 실행은 새 푸시가 오면 취소 — 러너 자원 절약.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Testcontainers(Postgres)/WireMock 통합테스트 515개 + 정적분석 + 컴파일 전체.
    # 매달림 방지(과거 로컬 colima 환경에서 ryuk 교착 이력 있음) — GitHub 호스팅 러너는
    # Docker 데몬이 기본 내장이라 여기서는 해당되지 않지만 안전망으로 타임아웃을 건다.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle 의존성/빌드 캐시(공식 액션 — actions/cache 를 직접 구성할 필요 없음).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ./gradlew build 는 :server:test(Testcontainers 통합테스트 515개, ktlintCheck, koverXmlReport 포함)
      # + client/examples 컴파일까지 전부 수행한다. ktlint 는 non-blocking(ignoreFailures=true, 기존 코드
      # 위반 5,051건 — server/build.gradle.kts 참고)이라 위반이 있어도 이 스텝에서 빌드가 깨지지 않는다.
      - name: Build (compile + static analysis + integration tests)
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: server/build/reports/ktlint/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload coverage report (kover)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/build/reports/kover/
          retention-days: 14
          if-no-files-found: warn

  # web 티어는 서버와 완전히 독립된 잡이다 — 툴체인(Node)도 실패 모드도 겹치지 않고,
  # 서버 통합테스트 30분을 기다린 뒤에야 타입 오류를 알게 되는 일이 없도록 병렬로 돈다.
  web-build:
    name: Web Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm install` 이 아니라 `npm ci` — 락파일을 조용히 갱신하지 않고 그대로 재현한다.
      - name: Install dependencies
        run: npm ci

      # next build 도 타입 검사를 하지만, 여기서 먼저 돌려 **어느 단계에서 깨졌는지**를 분리한다
      # (빌드 실패 로그 안에 섞이면 번들 오류인지 타입 오류인지 구분하는 데 시간이 든다).
      - name: Typecheck
        run: npx tsc --noEmit

      # ★lint 게이트가 없으면 지금의 0-오류 상태가 조용히 되돌아간다. 이 저장소의 eslint 규칙은
      # 취향이 아니라 **실제로 화면을 깨뜨린 것들**이다 — 렌더 중 setState(직전 조건의 결과가 한 프레임
      # 최신인 것처럼 보임)·렌더 중 내비게이션(동시성 렌더에서 중복 이동)이 그렇게 잡혔다.
      - name: Lint
        run: npm run lint

      # 포맷은 별도 확인이다(수정하지 않고 검사만) — 포맷 차이가 리뷰 diff 를 덮어 실제 변경을 가린다.
      - name: Format check
        run: npm run format:check

      # 단위 테스트(vitest). pos-session 은 **결제 승인의 유일한 관문**이라 여기서 깨지면 빌드보다
      # 먼저 알아야 한다 — 키 회전=즉시 회수, 등록 순서(맞는 키는 압력과 무관하게 통과) 같은
      # 불변식이 조용히 되돌아가는 것을 막는 유일한 장치다.
      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build

  docker-build:
    name: Docker Build
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 이미지 빌드만 검증(-x test 로 빌드하므로 테스트는 위 build-and-test 잡이 이미 검증했다).
      # 레지스트리 미정 — push 는 하지 않는다. 확장 지점: docker/login-action 으로 로그인 후
      # `docker push`(또는 docker/build-push-action 으로 대체)를 추가하면 된다.
      - name: Build image
        run: docker build -t taspa-server:${{ github.sha }} .

      # - name: Log in to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: <registry-host>
      #     username: ${{ secrets.REGISTRY_USERNAME }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}
      # - name: Push image
      #   run: docker push taspa-server:${{ github.sha }}

  web-docker-build:
    name: Web Docker Build
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ★빌드 컨텍스트는 `./web` 이다 — 저장소 루트를 주면 Docker 가 `web/.dockerignore` 를 읽지 않아
      # 개발자 머신의 `.env.local`(POS 결제 자격증명)이 이미지에 들어간다. CI 러너에는 그 파일이
      # 없지만, 여기 적힌 명령이 곧 배포 절차의 참조본이 되므로 컨텍스트를 흐리지 않는다.
      #
      # TASPA_ORIGIN 은 빌드 시각에 rewrites 목적지로 굳는다(web/Dockerfile 주석 참고). CI 는 이미지가
      # **빌드되는지**만 검증하므로 기본값으로 둔다 — 실배포 이미지는 환경별 오리진을 넘겨 다시 빌드해야 한다.
      - name: Build image
        run: docker build -f web/Dockerfile -t taspa-web:${{ github.sha }} ./web

      # ★"프록시 목적지는 빌드 시각에 굳는다" 를 **주석이 아니라 검사**로 고정한다. 이 사실이 조용히
      # 바뀌거나(런타임 설정으로 리팩터링) 반대로 잊히면(기본값 이미지를 그대로 배포) 결과가 같다 —
      # 프록시가 web 컨테이너 자신을 가리켜 **로그인은 되는데 화면이 전부 401**, 원인 추적이 어려운 형태다.
      - name: Assert proxy destination is baked at build time
        run: |
          dest=$(docker run --rm --entrypoint node taspa-web:${{ github.sha }} -e \
            "console.log(require('/app/.next/routes-manifest.json').rewrites.beforeFiles[0].destination)")
          echo "rewrite destination: $dest"
          if [ "${dest#http://localhost:9100}" = "$dest" ]; then
            echo "::error::빌드 인자 TASPA_ORIGIN 이 이미지에 반영되지 않았다(현재 '$dest'). 배포 절차 문서를 함께 갱신할 것"
            exit 1
          fi
          echo "OK: 목적지가 빌드 인자로 굳는다 — 실배포 이미지는 --build-arg TASPA_ORIGIN 으로 다시 빌드해야 한다"

      # 시크릿이 이미지에 섞여 들어가지 않는지 확인한다. `.dockerignore` 는 조용히 깨질 수 있는
      # 종류의 안전장치라(파일 하나 추가로 무력화된다) 회귀로 고정해 둔다.
      - name: Assert no .env files in image
        run: |
          # node_modules 를 제외하지 않는다 — 제외하면 손으로 돌린 검증보다 약해지고, 하필 그 경로에
          # 떨어진 파일을 놓친다(정상 이미지는 실측 0건이라 제외할 이유가 없다).
          found=$(docker run --rm --entrypoint sh taspa-web:${{ github.sha }} \
            -c 'find / -xdev -name ".env*" 2>/dev/null')
          if [ -n "$found" ]; then
            echo "::error::이미지에 env 파일이 포함됐다: $found"
            exit 1
          fi
          echo "OK: 이미지에 .env* 파일 없음"

      # ★파일명 단언만으로는 부족하다. 더 그럴듯한 다음 회귀는 "TASPA_ORIGIN 처럼 build-arg 를 하나 더
      # 추가해 해결"하는 것인데, 그렇게 들어온 값은 파일이 아니라 **이미지 레이어 메타데이터**에 남아
      # 위 find 에 걸리지 않는다. 시크릿 이름으로 히스토리를 직접 훑는다.
      - name: Assert no secrets baked into image layers
        run: |
          if docker history --no-trunc --format '{{.CreatedBy}}' taspa-web:${{ github.sha }} \
             | grep -Eiq 'POS_CLIENT_SECRET|POS_TERMINAL_KEY|POS_SESSION_SECRET'; then
            echo "::error::이미지 레이어에 POS 시크릿이 구워졌다 — 런타임 env 로만 주입할 것"
            exit 1
          fi
          echo "OK: 이미지 레이어에 시크릿 없음"
