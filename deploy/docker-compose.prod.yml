# 프로덕션 배포 매니페스트(단일 호스트 / Docker Compose).
#
# 루트 `docker-compose.yml` 은 **개발용**이다(약한 비밀번호·Mailpit·dev 프로파일). 이 파일은 그 반대다:
#   - DB 는 여기서 띄우지 않는다 — 외부 관리형 Postgres 를 쓴다(백업·복구·failover 는 우리가 만들 것이 아니다).
#   - 시크릿은 파일에 쓰지 않는다 — `.env.prod`(git 제외) 또는 오케스트레이터의 시크릿 주입으로 온다.
#   - 이미지 태그는 **고정**한다(`:latest` 금지 — 재기동이 곧 의도치 않은 배포가 된다).
#   - TLS 는 앞단 리버스 프록시가 종단한다. 그래서 `TASPA_TRUSTED_PROXIES` 가 필수다.
#
# 사용:
#   cp deploy/.env.prod.example deploy/.env.prod   # 값을 채운다
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d
#
# ★필수 환경변수가 하나라도 비면 서버가 **기동 최초 단계에서 멈추고 빠진 것을 전부 나열한다**
#   (`RequiredProdEnvValidator`). 값의 안전성(https·키 강도·두 키 분리)은 그 다음 단계에서 걸린다.
#
# ★★**선택 변수는 반드시 `KEY:`(값 없는 맨 키) 형태로 쓴다** — `${KEY:-}` 로 쓰면 안 된다.
#   `${KEY:-}` 는 미설정 시 변수를 **"빈 문자열로 정의"** 하는데, 스프링의 플레이스홀더 기본값
#   (`${A:${B}}`)은 값이 **없을 때만** 발동하고 비었을 때는 발동하지 않는다. 실제로 이 파일이
#   `TASPA_PUBLIC_BASE_URL: ${TASPA_PUBLIC_BASE_URL:-}` 이던 동안, README 가 "선택"이라고 적고
#   예시 파일이 주석 처리해 둔 그 변수 때문에 **문서대로 배포하면 서버가 아예 뜨지 못했다**
#   (password-reset/magic-link base-url 이 빈 문자열 → ProductionSafetyValidator 가 거부 →
#   `restart: unless-stopped` 로 크래시 루프, 그것도 배포자가 설정한 적 없는 속성 이름으로).
#   맨 키 형태는 `--env-file` 에 값이 있으면 전달하고, 없으면 **변수 자체를 만들지 않는다**(실측 확인).
#   같은 함정이 `TASPA_METRICS_SCRAPE_PASSWORD` 에도 있었다 — 빈 문자열도 `@ConditionalOnProperty` 는
#   "존재"로 보므로, 메트릭을 쓰지 않는 배포에서 전용 Basic 체인이 켜진 채 아무도 통과하지 못하고
#   ADMIN 세션으로도 열 수 없게 된다(application-prod.yml 이 이미 경고하는 그 상태다).

services:
  server:
    image: ${TASPA_SERVER_IMAGE}
    # SPRING_PROFILES_ACTIVE 는 이미지에 prod 로 내장돼 있다 — 여기서 덮지 않는다(덮으면 CSP·HSTS·
    # rate limit·XFF 신뢰·issuer 검증이 통째로 꺼진 채 정상 기동한다).
    environment:
      # ── 필수(미설정이면 기동 실패 + 누락 목록 안내) ─────────────────────────────
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      # 리버스 프록시(LB/인그레스)의 IP 대역 정규식. 이 대역에서 온 요청의 X-Forwarded-* 만 반영된다.
      # 틀리면 조용히 두 가지가 깨진다: (1) 세션·신뢰기기 쿠키의 Secure 플래그와 HSTS 가 안 붙고
      # (2) 리스크 판정·감사 로그·rate limit 이 전부 프록시 IP 하나로 뭉친다.
      TASPA_TRUSTED_PROXIES: ${TASPA_TRUSTED_PROXIES}
      TASPA_ISSUER_URI: ${TASPA_ISSUER_URI}
      TASPA_WEBAUTHN_RP_ID: ${TASPA_WEBAUTHN_RP_ID}
      TASPA_WEBAUTHN_ALLOWED_ORIGINS: ${TASPA_WEBAUTHN_ALLOWED_ORIGINS}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      TASPA_JWK_ENCRYPTION_KEY: ${TASPA_JWK_ENCRYPTION_KEY}

      # ── 선택(맨 키 형태 — 위 ★★ 참고. 값이 없으면 변수 자체가 생기지 않는다) ────
      DB_POOL_SIZE:
      MAIL_PORT:
      MAIL_USERNAME:
      MAIL_PASSWORD:
      # 메일 링크(비밀번호 재설정·매직링크·조직 초대)의 base. 미설정이면 issuer 를 쓴다.
      TASPA_PUBLIC_BASE_URL:
      # 설정해야 /actuator/prometheus 스크레이핑이 가능하다(미설정이면 그 경로는 ADMIN 세션 전용).
      TASPA_METRICS_SCRAPE_PASSWORD:
      TASPA_ADMIN_EMAILS:
      # 마이그레이션을 배포 파이프라인에서 따로 돌린다면 `false` 로 둔다(아래 주석 참고).
      SPRING_FLYWAY_ENABLED:
    # 호스트에서 도는 리버스 프록시(nginx 등)를 전제한 바인딩이다 — 공인 IP 에 직접 노출하지 않는다.
    # 프록시도 컨테이너라면 이 publish 를 지우고 같은 compose 네트워크에 붙여 `server:9100` 으로 부를 것
    # (컨테이너에서 127.0.0.1 은 자기 자신이라 이 바인딩에 닿지 못한다).
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
    stop_grace_period: 40s # graceful shutdown(timeout-per-shutdown-phase 30s)보다 넉넉히
    # ★메모리 제한은 선택이 아니다. 이미지가 `-XX:MaxRAMPercentage=75` 로 "컨테이너 메모리의 75%"를
    #   힙으로 잡는데, 제한이 없으면 그 분모가 **호스트 전체 RAM** 이 된다 — 64G 머신에서 힙 48G 를
    #   잡고 다른 프로세스를 밀어낸다. 값을 줄이거나 늘릴 수는 있어도 **지우지는 말 것**.
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  web:
    # ★이 이미지는 **`--build-arg TASPA_ORIGIN=http://server:9100` 으로 빌드돼 있어야 한다.**
    #   Next 의 rewrites 목적지는 빌드 시각에 `.next/routes-manifest.json` 으로 굳어 **런타임 환경변수로는
    #   바뀌지 않는다**(web/Dockerfile 이 같은 경고를 담고 있다). 기본값으로 빌드된 이미지를 그대로
    #   배포하면 프록시가 `http://localhost:9100`(=web 컨테이너 자신)을 가리켜 화면이 전부 401 이 된다.
    #     docker build -f web/Dockerfile --build-arg TASPA_ORIGIN=http://server:9100 -t <tag> ./web
    #   확인: docker run --rm --entrypoint node <tag> -e \
    #     "console.log(require('/app/.next/routes-manifest.json').rewrites.beforeFiles[0].destination)"
    #   아래 TASPA_ORIGIN 런타임 값은 **POS BFF(lib/pos-terminal.ts)가 런타임에 읽는 용도**로 남긴다 —
    #   프록시 목적지를 바꾸지는 못하므로 빌드 인자와 **같은 값**이어야 한다.
    image: ${TASPA_WEB_IMAGE}
    environment:
      TASPA_ORIGIN: http://server:9100
      POS_TERMINAL_KEY:
      POS_SESSION_SECRET:
      POS_TRUSTED_PROXY:
      POS_CLIENT_ID:
      POS_CLIENT_SECRET:
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
# ── 마이그레이션에 대하여 ────────────────────────────────────────────────────────
# README 는 "마이그레이션은 앱 부팅과 분리한다(필수)" 라고 적는다. 그 요구사항이 푸는 문제는 두 가지다:
#   (1) 스키마 변경 시간이 곧 기동 지연이 되어 무중단 배포의 구멍이 된다,
#   (2) 롤아웃 도중 구/신 버전이 섞인 채 마이그레이션이 도는 창이 생긴다.
# **둘 다 레플리카가 여럿일 때의 문제**다. 이 매니페스트는 단일 인스턴스 단일 호스트를 전제하므로
# 앱 부팅 시 Flyway 를 그대로 쓴다(동시 기동 상호배제는 Flyway 의 PostgreSQL advisory lock 이 보장한다).
#
# 다중 레플리카·무중단 롤아웃으로 넘어가는 순간 이 전제가 깨진다. 그때는
#   1. 배포 파이프라인의 선행 잡에서 `flyway migrate` 를 끝내고,
#   2. `.env.prod` 에 `SPRING_FLYWAY_ENABLED=false` 를 넣어 앱이 마이그레이션을 시도하지 않게 한다.
# 여기에 가짜 `migrate` 서비스를 넣지 않은 이유는, 그것이 "분리했다"는 착각만 주고 위 두 문제를 실제로
# 풀지 않기 때문이다(같은 compose up 안에서 도는 선행 컨테이너는 파이프라인 단계가 아니다).
