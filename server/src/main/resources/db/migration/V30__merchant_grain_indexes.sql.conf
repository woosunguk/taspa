# Flyway 스크립트 설정(사이드카). 같은 이름 + .conf 규약으로 V30 에만 적용된다.
# CREATE INDEX CONCURRENTLY 는 트랜잭션 블록에서 실행할 수 없다. PostgreSQLParser 의 자동 감지에만
# 맡기지 않고 여기서 명시한다 — 파서 정규식은 드라이버 플러그인 구현 세부라 버전에 따라 변할 수 있다.
# (인라인 `-- flyway:executeInTransaction=false` 주석 형태는 Flyway 10.20.1 이 읽지 않는다. 사이드카가 유일한 명시 수단.)
executeInTransaction=false
