error.MERCHANT_SUSPENDED=현재 이용할 수 없는 가맹점입니다. 가맹점 또는 관리자에게 문의해 주세요.
error.INVOICE_ALREADY_FINALIZED=이미 확정된 청구서는 수정할 수 없습니다. 새 기간의 청구서를 생성해 주세요.
error.INVOICE_STALE=청구서 내용이 최신 사용 내역과 다릅니다. 다시 생성한 뒤 확정해 주세요.
error.MEAL_POLICY_OVERRIDE_EXISTS=이 대상에는 이미 상시 재정의가 있습니다. 기존 항목을 수정해 주세요
error.IAM_POLICY_NOT_FOUND=정책을 찾을 수 없습니다. 목록에서 다시 선택해 주세요.
error.IAM_POLICY_IMMUTABLE=시스템 기본 정책은 수정하거나 삭제할 수 없습니다. 새 정책을 만들어 사용해 주세요.
error.IAM_VALIDATION=정책 문서 형식이 올바르지 않습니다. 작성 규칙을 확인하고 다시 저장해 주세요.
error.IAM_CONFLICT=같은 이름의 항목이 이미 있습니다. 다른 이름을 입력해 주세요.
error.IAM_LOCKOUT=이 변경을 적용하면 IAM 정책을 관리할 수 있는 플랫폼 관리자가 아무도 남지 않습니다. 되돌릴 방법이 없어지므로 저장하지 않았습니다.
error.METHOD_NOT_ALLOWED=이 주소에서는 지원하지 않는 요청 방식입니다. 요청 방식을 확인해 주세요.
error.UNSUPPORTED_MEDIA_TYPE=지원하지 않는 요청 형식입니다. Content-Type 을 확인해 주세요.
error.INTERNAL_ERROR=요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.

