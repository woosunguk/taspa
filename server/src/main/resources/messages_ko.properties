mail.invoiceDraft.subject=[taspa] 지난달 청구서 초안이 준비되었습니다
mail.invoiceDraft.body={0} 조직의 {1} 청구서 초안이 자동으로 만들어졌습니다.\n\n조직 부담 합계: {2}원 ({3}건)\n\n아래에서 내역을 확인하고 이상이 없으면 확정하세요:\n{4}\n\n확정 전에는 언제든 다시 생성해 숫자를 갱신할 수 있습니다. 확정한 청구서는 더 이상 바뀌지 않습니다.
mail.merchantAdmin.subject=[taspa] 매장 관리자로 지정되었습니다
mail.merchantAdmin.body={0} 매장의 관리자로 지정되었습니다.\n\n매장 관리 화면에서 식수 로그·예측·정산 명세를 확인할 수 있습니다.\n{1}\n\n결제 승인은 매장 단말(POS)에서만 이루어집니다 — 이 화면에는 결제 기능이 없습니다.
mail.merchantAdmin.bodyPending={0} 매장의 관리자로 지정되었습니다.\n\n다만 이 매장은 아직 활성화되지 않아 지금은 관리 화면과 결제가 열리지 않습니다. 플랫폼 운영자가 활성 상태로 바꾸면 아래 주소에서 바로 이용할 수 있습니다.\n{1}\n\n권한은 이미 부여되어 있으니 별도로 요청하실 필요는 없습니다.
