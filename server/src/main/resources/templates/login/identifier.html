<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.signin.title}">Sign in · taspa</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-card">
    <div class="wordmark"><b>taspa</b></div>
    <h1 class="auth-title" th:text="#{login.identifier.heading}">Sign in</h1>
    <p class="auth-subtitle" th:text="#{login.identifier.subtitle}">Continue with your taspa account</p>

    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form method="post" action="/login/identifier">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field">
            <label for="email" th:text="#{common.email}">Email</label>
            <input type="email" id="email" name="email" th:value="${email}" autofocus required>
        </div>
        <div class="stack-links">
            <a class="link" href="/signup" th:text="#{login.identifier.createAccount}">Create account</a>
        </div>
        <div class="actions end">
            <button type="submit" class="btn-primary" th:text="#{common.next}">Next</button>
        </div>
    </form>

    <hr class="divider">
    <button type="button" class="btn-secondary" id="passkey-signin" style="width:100%;"
            th:text="#{login.identifier.passkeySignin}">Sign in with a passkey</button>

    <!-- 소셜 로그인: 등록된 공급자만 렌더링. 브랜드 로고 에셋 없이 텍스트 버튼(실배포 시 공식 에셋 교체). -->
    <div th:if="${!#lists.isEmpty(socialProviders)}">
        <a th:each="p : ${socialProviders}"
           class="btn-secondary"
           style="display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;margin-top:8px;"
           th:href="'/oauth2/authorization/' + ${p.id}"
           th:text="#{login.social.continueWith(${p.label})}">Continue with Google</a>
    </div>

    <!-- 기업 SSO(Stage E): enforced=false 커넥션의 보조 진입점. enforced 커넥션은 이메일 도메인 입력(HRD)으로 자동 라우팅된다. -->
    <div th:if="${!#lists.isEmpty(ssoProviders)}">
        <a th:each="s : ${ssoProviders}"
           class="btn-secondary"
           style="display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;margin-top:8px;"
           th:href="${s.entryPath}"
           th:text="#{login.sso.continueWith(${s.label})}">Sign in with your company account</a>
    </div>

    <div class="lang-switch" style="text-align:center;margin-top:20px;font-size:12px;">
        <a class="link" href="?lang=ko" th:text="#{common.lang.ko}">Korean</a>
        <span aria-hidden="true">·</span>
        <a class="link" href="?lang=en" th:text="#{common.lang.en}">English</a>
    </div>
</main>

<script src="/js/webauthn.js"></script>
<script th:inline="javascript">
    // usernameless(discoverable credential) 로그인: allowCredentials 빈 배열로 어서션을 요청한다.
    const csrfHeaders = {[[${_csrf.headerName}]]: [[${_csrf.token}]]};
    setupLogin(csrfHeaders, '', document.getElementById('passkey-signin'));
</script>
</body>
</html>
