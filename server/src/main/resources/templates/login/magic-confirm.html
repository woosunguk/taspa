<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.magicConfirm.title}">Confirm sign-in · taspa</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-card">
    <div class="wordmark"><b>taspa</b></div>
    <h1 class="auth-title" th:text="#{login.magicConfirm.heading}">Sign in to taspa?</h1>

    <div class="email-chip">
        <span class="dot" th:text="${#strings.substring(email,0,1)}">u</span>
        <span th:text="${email}">user@example.com</span>
    </div>

    <p class="auth-subtitle" th:text="#{login.magicConfirm.subtitle}">Click the button below to sign in on this browser</p>

    <!-- GET 랜딩은 토큰을 소비하지 않는다 — 버튼 클릭(POST)이 소비·로그인한다(이메일 스캐너 선클릭 방지). -->
    <form method="post" action="/login/magic">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">
        <div class="actions end">
            <button type="submit" class="btn-primary" th:text="#{common.signin}">Sign in</button>
        </div>
    </form>
</main>
</body>
</html>
