<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.magicInvalid.title}">Link expired · taspa</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-card">
    <div class="wordmark"><b>taspa</b></div>
    <h1 class="auth-title" th:text="#{login.magicInvalid.heading}">This link can't be used</h1>
    <div class="alert alert-error" th:text="#{login.magicInvalid.alert}">The link has expired or has already been used</div>
    <p class="auth-subtitle" th:text="#{login.magicInvalid.subtitle}">Please request a new link from the sign-in screen.</p>
    <div class="stack-links">
        <a class="link" href="/login" th:text="#{common.backToLogin}">Back to sign in</a>
    </div>
</main>
</body>
</html>
