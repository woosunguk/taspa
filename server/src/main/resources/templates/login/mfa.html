<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.mfa.title}">Two-factor authentication · taspa</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-card">
    <div class="wordmark"><b>taspa</b></div>
    <h1 class="auth-title" th:text="#{login.mfa.heading}">Two-factor authentication</h1>
    <p class="auth-subtitle" th:if="${!useBackupCode}" th:text="#{login.mfa.subtitle.totp}">Enter the 6-digit code from your authenticator app</p>
    <p class="auth-subtitle" th:if="${useBackupCode}" th:text="#{login.mfa.subtitle.backup}">Enter one of your backup codes</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form method="post" action="/login/mfa">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="method" th:value="${useBackupCode} ? 'backup' : 'totp'">
        <div class="field">
            <label for="code" th:text="${useBackupCode} ? #{login.mfa.label.backup} : #{common.verificationCode}">Verification code</label>
            <input type="text" id="code" name="code" inputmode="text" autocomplete="one-time-code" autofocus required>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="trustDevice" name="trustDevice" value="on" style="width:auto;margin:0;">
            <label for="trustDevice" style="margin:0;font-weight:normal;" th:text="#{login.mfa.trustDevice}">Don't ask again on this device for 30 days</label>
        </div>
        <div class="actions">
            <a class="link" th:if="${!useBackupCode}" href="/login/mfa?method=backup" th:text="#{common.tryAnotherWay}">Try another way</a>
            <a class="link" th:if="${useBackupCode}" href="/login/mfa" th:text="#{login.mfa.useTotp}">Use authenticator app code</a>
            <button type="submit" class="btn-primary" th:text="#{common.confirm}">Confirm</button>
        </div>
    </form>
</main>
</body>
</html>
