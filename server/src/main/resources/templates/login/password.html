<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.signin.title}">Sign in · taspa</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-card">
    <div class="wordmark"><b>taspa</b></div>
    <h1 class="auth-title" th:text="#{login.password.heading}">Welcome back</h1>

    <div class="email-chip">
        <span class="dot" th:text="${#strings.substring(email,0,1)}">u</span>
        <span th:text="${email}">user@example.com</span>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form method="post" action="/login/password">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="username" th:value="${email}">
        <div class="field">
            <label for="password" th:text="#{common.passwordEnter}">Enter your password</label>
            <input type="password" id="password" name="password" autofocus required>
        </div>
        <div class="actions">
            <a class="link" href="/password-reset" th:text="#{login.password.forgot}">Forgot your password?</a>
            <button type="submit" class="btn-primary" th:text="#{common.signin}">Sign in</button>
        </div>
    </form>

    <div class="stack-links" th:if="${hasPasskeys}">
        <a class="link" href="/login/passkey" th:text="#{common.usePasskey}">Use a passkey</a>
    </div>

    <!-- 매직 링크: 비밀번호 없이 메일 링크로 로그인 (소셜 전용 계정 포함). -->
    <form method="post" action="/login/magic/request" style="margin-top:12px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="link" style="background:none;border:none;padding:0;cursor:pointer;"
                th:text="#{login.password.magicLink}">Email me a sign-in link</button>
    </form>

    <!-- 이 계정에 연결된 소셜 공급자 — 소셜 전용 계정도 로그인 경로를 잃지 않도록 버튼 노출. -->
    <div th:if="${!#lists.isEmpty(linkedProviders)}">
        <hr class="divider">
        <a th:each="p : ${linkedProviders}"
           class="btn-secondary"
           style="display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;margin-top:8px;"
           th:href="'/oauth2/authorization/' + ${p.id}"
           th:text="#{login.social.continueWith(${p.label})}">Continue with Google</a>
    </div>
</main>
</body>
</html>
