<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.socialEmail.title}">Enter your email · taspa</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-card">
    <div class="wordmark"><b>taspa</b></div>
    <h1 class="auth-title" th:text="#{login.socialEmail.heading}">Enter your email</h1>

    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- 1단계: 이메일 입력 (공급자가 이메일을 제공하지 않음) -->
    <div th:unless="${codeStep}">
        <p class="auth-subtitle" th:text="#{login.socialEmail.prompt(${providerLabel})}">
            We could not read an email address from your provider account.
        </p>
        <form method="post" action="/login/social-email">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="email" th:text="#{common.email}">Email</label>
                <input type="email" id="email" name="email" autofocus required>
            </div>
            <div class="actions end">
                <button type="submit" class="btn-primary" th:text="#{login.socialEmail.sendCode}">Send verification code</button>
            </div>
        </form>
    </div>

    <!-- 2단계: 인증 코드 확인 -->
    <div th:if="${codeStep}">
        <p class="auth-subtitle" th:text="#{common.code.sentPrompt(${email})}">
            Enter the 6-digit code sent to your email
        </p>
        <form method="post" action="/login/social-email/verify">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="code" th:text="#{common.verificationCode}">Verification code</label>
                <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus required>
            </div>
            <div class="actions">
                <button type="submit" class="btn-primary" th:text="#{common.verify}">Verify</button>
            </div>
        </form>

        <hr class="divider">

        <form method="post" action="/login/social-email/resend">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="link" style="background:none;border:none;padding:0;cursor:pointer;"
                    th:text="#{common.resendCode}">
                Didn't get the code? Resend
            </button>
        </form>
    </div>
</main>
</body>
</html>
