<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{passwordReset.request.title}">Reset password · taspa</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-card">
    <div class="wordmark"><b>taspa</b></div>
    <h1 class="auth-title" th:text="#{passwordReset.request.heading}">Reset your password</h1>
    <p class="auth-subtitle" th:text="#{passwordReset.request.subtitle}">We'll send a reset link to your registered email</p>

    <!--
      ★오류 슬롯이 없으면 **왜 여기 왔는지가 사라진다.** 죽은 재설정 링크는 이제 이 화면으로 오는데
      (비밀번호를 헛되이 입력시키지 않으려고), 사유를 못 그리면 사용자는 링크를 눌렀는데 갑자기
      처음 화면이 나온 것으로 보인다 — 고치려던 침묵이 한 화면 뒤로 옮겨졌을 뿐이 된다.
    -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

    <form method="post" action="/password-reset">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field">
            <label for="email" th:text="#{common.email}">Email</label>
            <input type="email" id="email" name="email" autofocus required>
        </div>
        <div class="actions">
            <a class="link" href="/login" th:text="#{common.backToLogin}">Back to sign in</a>
            <button type="submit" class="btn-primary" th:text="#{passwordReset.request.submit}">Send link</button>
        </div>
    </form>
</main>
</body>
</html>
