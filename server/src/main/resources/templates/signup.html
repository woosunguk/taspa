<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{signup.title}">Create account · taspa</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-card">
    <div class="wordmark"><b>taspa</b></div>
    <h1 class="auth-title" th:text="#{signup.heading}">Create your taspa account</h1>
    <p class="auth-subtitle" th:text="#{signup.subtitle}">Enter your details to continue</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form method="post" action="/signup">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field">
            <label for="displayName" th:text="#{signup.displayName}">Name (optional)</label>
            <input type="text" id="displayName" name="displayName" th:value="${displayName}">
        </div>
        <div class="field">
            <label for="email" th:text="#{common.email}">Email</label>
            <input type="email" id="email" name="email" th:value="${email}" required>
        </div>
        <div class="field">
            <label for="password" th:text="#{common.password}">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <p class="hint" th:text="#{common.passwordHint}">At least 12 characters</p>
        <div class="actions">
            <a class="link" href="/login" th:text="#{signup.haveAccount}">Already have an account?</a>
            <button type="submit" class="btn-primary" th:text="#{common.next}">Next</button>
        </div>
    </form>
</main>
</body>
</html>
